name: unitask
description: "UniTask - University Task Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  path: ^1.9.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_riverpod: ^2.6.1
  uuid: ^4.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-profile.png"
